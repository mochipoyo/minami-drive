<script>(function(l){if(!l)return;l.addEventListener('load',function(){l.media='all';l.setAttribute('data-st','ok');});l.addEventListener('error',function(){l.setAttribute('data-st','err');});})(document.getElementById('fontCss'));</script>
<style>
/* Layout: full-bleed 3D road view; HUD clusters sit at the screen edges like an instrument panel; menus are a driving-school record card (教習原簿) with hanko stamps. */
:root{
  --asphalt:#161b20; --asphalt-2:#232a31;
  --hud-bg:rgba(13,17,21,.74); --hud-line:rgba(255,255,255,.14); --hud-fg:#f1f4f2; --hud-dim:#9fb0a8;
  --paper:#eef2ec; --paper-2:#e2e9e2; --paper-ink:#1c2622; --rule:#b9c7bd;
  --hanko:#c8342c; --sign-blue:#1f55a5; --go:#00a497; --amber:#f0a500; --stop:#d42a2a; --ok:#2e9e5b;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  --f-num:"Saira Condensed","DIN Alternate","Arial Narrow",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
.card{color-scheme:light}
html,body{height:100%;margin:0;overflow:hidden;background:var(--asphalt);color:var(--hud-fg);font-family:var(--f-ui);-webkit-tap-highlight-color:transparent}
body{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--f-ui);cursor:pointer}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.hud{position:fixed;pointer-events:none;z-index:5}
.hud *{pointer-events:auto}
.panel{background:var(--hud-bg);border:1px solid var(--hud-line);border-radius:10px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
/* top-left: course + navigation */
#hudTL{top:calc(10px + env(safe-area-inset-top,0px));left:12px;display:flex;flex-direction:column;gap:8px;width:min(250px,40vw)}
#stageChip{padding:6px 10px;font-size:12px;color:var(--hud-dim);letter-spacing:.04em}
#stageChip b{color:var(--hud-fg);font-weight:700;display:block;font-size:14px;letter-spacing:0}
#nav{display:flex;gap:10px;align-items:center;padding:8px 10px}
#navArrow{width:46px;height:46px;flex:none}
#navDist{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
#navDist small{font-size:14px;margin-left:2px;color:var(--hud-dim)}
#navText{font-size:13px;line-height:1.35}
#mini{width:100%;aspect-ratio:1;max-width:170px;border-radius:10px}
/* top-right */
#hudTR{top:calc(10px + env(safe-area-inset-top,0px));right:12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#scoreBox{padding:6px 12px;text-align:right}
#scoreBox .lbl{font-size:11px;color:var(--hud-dim);letter-spacing:.06em}
#scoreVal{font-family:var(--f-num);font-size:34px;font-weight:700;line-height:1}
#timeVal{font-family:var(--f-num);font-size:15px;color:var(--hud-dim)}
.iconRow{display:flex;gap:6px}
.ibtn{width:40px;height:40px;border-radius:9px;border:1px solid var(--hud-line);background:var(--hud-bg);color:var(--hud-fg);font-size:13px;font-weight:700;display:grid;place-items:center;padding:0}
.ibtn svg{width:20px;height:20px}
/* mirrors (WebGL draws inside these frames) */
.mirror{position:fixed;border:3px solid #0b0d0f;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.45);pointer-events:none;z-index:4}
#mirRear{top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(300px,34vw);height:min(84px,10vw)}
#mirL{left:10px;top:52%;width:min(150px,17vw);height:min(92px,11vw);border-radius:18px 10px 10px 22px}
#mirR{right:10px;top:52%;width:min(150px,17vw);height:min(92px,11vw);border-radius:10px 18px 22px 10px}
#rearCam{left:50%;transform:translateX(-50%);bottom:calc(118px + env(safe-area-inset-bottom,0px));width:min(330px,44vw);height:min(220px,30vw);border-radius:8px;border-color:#222;z-index:6}
#rearGuide{position:absolute;inset:0;width:100%;height:100%}
.camLbl{position:absolute;left:0;right:0;top:4px;text-align:center;font-size:10px;color:#fff;text-shadow:0 1px 2px #000}
body.touch #rearCam{bottom:calc(184px + env(safe-area-inset-bottom,0px))}
/* 狭い画面：バックモニターはルームミラーの位置に出し、教官の案内をその下へ */
@media (max-height:520px){
  #rearCam,body.touch #rearCam{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;width:min(270px,36vw);height:min(150px,38vh)}
  body.touch.revcam #coach{top:calc(min(150px,38vh) + 16px + env(safe-area-inset-top,0px))}
}
@media (orientation:portrait) and (max-width:620px){
  #rearCam,body.touch #rearCam{top:calc(156px + env(safe-area-inset-top,0px));bottom:auto;width:76vw;height:44vw}
  body.touch.revcam #coach{top:calc(164px + 44vw + env(safe-area-inset-top,0px))}
  body.revcam #toasts{top:calc(232px + 44vw + env(safe-area-inset-top,0px))}
}
/* cluster */
#cluster{bottom:calc(14px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:8px 16px}
#speedWrap{text-align:center;min-width:92px}
#speedVal{font-family:var(--f-num);font-size:54px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums}
#speedUnit{font-size:11px;color:var(--hud-dim);letter-spacing:.08em}
#limitSign{width:58px;height:58px;border-radius:50%;background:#fff;border:6px solid var(--stop);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:26px;color:var(--sign-blue);position:relative}
#limitSign.over{animation:pulse .6s infinite alternate}
#limitTag{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-family:var(--f-ui);font-size:10px;color:var(--hud-fg);white-space:nowrap;background:var(--hud-bg);padding:1px 5px;border-radius:5px}
@keyframes pulse{to{box-shadow:0 0 0 6px rgba(212,42,42,.55)}}
#lamps{display:grid;grid-template-columns:repeat(3,auto);gap:4px 8px;font-size:11px;align-items:center}
.lamp{opacity:.22;font-weight:700;display:flex;align-items:center;gap:3px}
.lamp.on{opacity:1}
.lamp.blk{color:var(--go)}
.lamp.haz{color:var(--stop)}
.lamp.warn{color:var(--amber)}
#gearBox{font-family:var(--f-num);font-size:20px;font-weight:700;letter-spacing:.12em;color:var(--hud-dim)}
#gearBox b{color:var(--hud-fg)}
/* coach */
#coach{left:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));max-width:min(360px,46vw);display:flex;gap:8px;align-items:flex-start;padding:9px 12px;font-size:14px;line-height:1.5;transition:opacity .3s}
#coach .who{flex:none;font-size:11px;font-weight:700;color:var(--panel-ink,#0d1114);background:var(--amber);border-radius:5px;padding:2px 6px;margin-top:2px}
#coach.hide{opacity:0}
/* toasts */
#toasts{right:12px;top:30%;display:flex;flex-direction:column;gap:8px;width:min(330px,44vw)}
.toast{padding:9px 12px;border-left:5px solid var(--stop);font-size:13px;line-height:1.5;animation:tin .25s ease-out}
.toast.good{border-left-color:var(--ok)}
.toast.info{border-left-color:var(--sign-blue)}
.toast b{display:block;font-size:14px}
.toast .pt{float:right;font-family:var(--f-num);font-size:18px;font-weight:700;color:var(--stop);margin-left:8px}
.toast.good .pt{color:var(--ok)}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
/* bottom controls */
#ctrlBar{bottom:calc(14px + env(safe-area-inset-bottom,0px));right:12px;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:min(360px,40vw)}
.cbtn{min-width:52px;height:44px;padding:0 8px;border-radius:9px;border:1px solid var(--hud-line);background:var(--hud-bg);color:var(--hud-fg);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.cbtn kbd{font-family:var(--f-num);font-size:11px;color:var(--hud-dim);font-weight:500}
.cbtn.on{background:var(--go);color:#062320;border-color:transparent}
.cbtn.on kbd{color:#0b3a35}
.cbtn.alert{background:var(--amber);color:#2a1a00}
#touchL{left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:150px;height:150px}
#wheel{width:150px;height:150px;border-radius:50%;touch-action:none}
#touchR{right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:flex-end}
.pedal{width:62px;border-radius:12px;border:1px solid var(--hud-line);background:var(--hud-bg);color:var(--hud-fg);font-weight:700;font-size:13px;touch-action:none;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
#pedBrake{height:96px;width:84px}
#pedAcc{height:128px}
.pedal.down{background:var(--hud-fg);color:var(--asphalt)}
/* 次に押すボタン（黄色く光る）。キーボードではキー名、タッチでは「タップ」を上に出す */
.cbtn,.pedal{position:relative}
.cbtn small{display:none}
.cbtn.hint,.pedal.hint{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber);animation:hintPulse 1s ease-in-out infinite}
@keyframes hintPulse{50%{box-shadow:0 0 0 2px var(--amber),0 0 18px 6px rgba(240,165,0,.8)}}
.cbtn.hint::after,.pedal.hint::after{content:attr(data-key) 'キー';position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--amber);color:#2a1a00;font-size:10px;font-weight:700;line-height:1;padding:3px 6px;border-radius:9px;white-space:nowrap;pointer-events:none;z-index:1}
body.touch .cbtn.hint::after{content:'タップ'}
.pedal.hint::after,body.touch .pedal.hint::after{content:'押し続ける';top:-13px}
/* タッチ操作のレイアウト：ボタンはハンドルとペダルの間に2段×5列。横にスクロールさせない */
#gearBox{white-space:nowrap}
body.touch #ctrlBar{left:144px;right:162px;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:none;margin:0 auto;width:auto;max-width:480px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
body.touch .cbtn{min-width:0;width:100%;height:44px;padding:0 3px;font-size:12px;white-space:nowrap}
body.touch .cbtn kbd{display:none}
body.touch .cbtn small{display:block;font-size:9px;font-weight:400;color:var(--hud-dim);margin-top:2px}
body.touch .cbtn.on small{color:#0b3a35}
body.touch #gearBox{font-size:17px;letter-spacing:.06em}
body.touch #cluster{bottom:calc(114px + env(safe-area-inset-bottom,0px));padding:4px 12px;gap:10px}
body.touch #lamps{display:none}
body.touch #speedVal{font-size:36px}
body.touch #limitSign{width:44px;height:44px;font-size:19px;border-width:5px}
body.touch #limitTag{bottom:-14px}
body.touch #coach{left:50%;transform:translateX(-50%);top:calc(min(84px,10vw) + 18px + env(safe-area-inset-top,0px));bottom:auto;max-width:min(440px,46vw);font-size:12px;padding:6px 10px}
body.touch #touchL,body.touch #wheel{width:120px;height:120px}
body.touch #pedBrake{height:84px;width:72px}
body.touch #pedAcc{height:112px;width:58px}
body.touch #phone{bottom:calc(174px + env(safe-area-inset-bottom,0px))}
@media (max-width:700px){
  #hudTL{width:min(190px,46vw)} #mini{max-width:120px} #navDist{font-size:24px} #navArrow{width:36px;height:36px}
  #speedVal{font-size:40px} #limitSign{width:46px;height:46px;font-size:20px;border-width:5px}
  #toasts{top:auto;bottom:calc(250px + env(safe-area-inset-bottom,0px));width:min(300px,70vw)}
  #coach{font-size:12px}
}
@media (max-height:520px){
  #stageChip{display:none} #hudTL{width:min(210px,30vw);gap:6px} #mini{max-width:96px}
  #nav{padding:5px 8px;gap:6px} #navArrow{width:30px;height:30px} #navDist{font-size:20px} #navText{font-size:11px}
  #mirRear{width:min(250px,30vw);height:56px} #mirL,#mirR{top:44%;width:110px;height:62px}
  #toasts{top:calc(150px + env(safe-area-inset-top,0px));bottom:auto;width:min(280px,34vw)} .toast{font-size:11px;padding:6px 9px} .toast b{font-size:12px}
  #scoreVal{font-size:26px} .ibtn{width:36px;height:36px}
  body.touch #coach{top:calc(74px + env(safe-area-inset-top,0px));left:calc(min(210px,30vw) + 22px);right:150px;transform:none;max-width:none}
}
@media (max-height:360px){#mini{display:none}}
@media (orientation:landscape) and (max-width:600px){
  body.touch #ctrlBar{left:122px;right:140px;gap:4px}
  body.touch .cbtn{height:38px;font-size:10px}
  body.touch .cbtn small{display:none}
  body.touch #touchL,body.touch #wheel{width:100px;height:100px}
  body.touch #pedBrake{width:60px;height:72px} body.touch #pedAcc{width:50px;height:96px}
  body.touch #cluster{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
}
@media (orientation:portrait) and (max-width:620px){
  body.touch #ctrlBar{left:8px;right:8px;max-width:none;bottom:calc(146px + env(safe-area-inset-bottom,0px))}
  body.touch #cluster{bottom:calc(250px + env(safe-area-inset-bottom,0px))}
  body.touch #phone{bottom:calc(310px + env(safe-area-inset-bottom,0px))}
  #mini{display:none} #hudTL{width:min(200px,calc(100vw - 170px))}
  #mirRear{top:calc(156px + env(safe-area-inset-top,0px));width:64vw;height:50px}
  body.touch #coach{top:calc(216px + env(safe-area-inset-top,0px));left:12px;right:12px;transform:none;max-width:none}
  #toasts{top:calc(280px + env(safe-area-inset-top,0px));bottom:auto;right:12px;left:12px;width:auto}
}
/* 画面の操作ガイド（スポットライト＋吹き出し） */
#guide{position:fixed;inset:0;z-index:25;touch-action:none}
#guide.dim{background:rgba(8,11,14,.72)}
#guide .spot{position:fixed;border:3px solid var(--amber);border-radius:14px;box-shadow:0 0 0 9999px rgba(8,11,14,.72);pointer-events:none}
#guide .tip{position:fixed;width:min(290px,calc(100vw - 16px));box-sizing:border-box;background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:10px 14px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:light;animation:gin .2s ease-out}
@keyframes gin{from{opacity:0;transform:translateY(6px)}}
#guide .st{font-size:11px;letter-spacing:.12em;color:#55665d}
#guide h3{font-family:var(--f-display);font-weight:400;font-size:18px;margin:2px 0 4px}
#guide p{margin:0;font-size:13px;line-height:1.6}
#guide .btnRow{margin-top:10px;justify-content:flex-end}
#guide .go,#guide .ghost{padding:7px 12px;font-size:13px}
/* overlays: record card */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(90deg,rgba(10,13,16,.78),rgba(10,13,16,.35));overflow:auto}
.card{background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.5);width:min(760px,100%);max-height:100%;overflow:auto;position:relative}
.card header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px 22px 12px;border-bottom:2px solid var(--paper-ink);flex-wrap:wrap}
.card h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,40px);margin:0;letter-spacing:.02em;text-wrap:balance}
.card h2{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:#55665d}
.plate{border:2px solid var(--paper-ink);padding:4px 10px;font-weight:700;font-size:13px;background:#fff;letter-spacing:.08em}
.card .body{padding:14px 22px 20px}
.lede{font-size:14px;line-height:1.7;margin:0 0 12px;max-width:60ch}
table.genbo{width:100%;border-collapse:collapse;font-size:14px}
.genbo th{white-space:nowrap;font-size:11px;letter-spacing:.08em;color:#55665d;text-align:left;font-weight:400;border-bottom:1px solid var(--rule);padding:4px 6px}
.genbo td{border-bottom:1px solid var(--rule);padding:8px 6px;vertical-align:middle}
.genbo tr.row{cursor:pointer}
.genbo tr.row:hover td{background:var(--paper-2)}
.genbo .no{font-family:var(--f-num);font-size:20px;font-weight:700;width:34px}
.genbo .ttl b{display:block;font-size:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 12px}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:#fff;color:var(--paper-ink);border:1.5px solid var(--rule);border-radius:6px;padding:6px 12px 5px;font-family:var(--f-ui);cursor:pointer;min-width:84px}
.tab b{font-size:14px}.tab small{font-size:10.5px;color:#55665d;letter-spacing:.02em}
.tab[aria-selected="true"]{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}.tab[aria-selected="true"] small{color:#c9d6cf}
.tab:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
@media (max-width:560px){.tabs{display:grid;grid-template-columns:repeat(3,1fr)}.tab{min-width:0;padding:6px 8px}}
.genbo .ttl span{font-size:12px;color:#4d5d55;line-height:1.5}
.envPick{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.envPick .tab{min-width:0;padding:7px 12px}
.genbo .best{font-family:var(--f-num);font-size:18px;text-align:right;white-space:nowrap}
.stampCell{width:64px;text-align:center}
.stamp{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;border:3px solid var(--hanko);color:var(--hanko);font-family:var(--f-display);font-size:14px;transform:rotate(-12deg);opacity:.9;line-height:1.05;text-align:center}
.stamp.big{width:120px;height:120px;font-size:34px;border-width:6px}
.stamp.ng{border-color:#5d6a64;color:#5d6a64}
.go{background:var(--paper-ink);color:var(--paper);border:0;border-radius:6px;padding:9px 16px;font-size:14px;font-weight:700}
.ghost{background:transparent;color:var(--paper-ink);border:1.5px solid var(--paper-ink);border-radius:6px;padding:8px 14px;font-size:14px;font-weight:700}
.btnRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.small{font-size:12px;color:#4d5d55;line-height:1.6}
.card a{color:var(--sign-blue);text-underline-offset:2px}
.vlist{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.vlist li{border-left:4px solid var(--stop);background:#fff;padding:8px 10px;font-size:13px;line-height:1.6}
.vlist li.good{border-left-color:var(--ok)}
.vlist li.info{border-left-color:var(--sign-blue)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:4px}.choice{text-align:left;font-weight:600;line-height:1.5}.choice.ng{opacity:.5;text-decoration:line-through}.choice.okc{border-color:var(--ok);background:#e6f3ec}

   ほかの操作部品と重ならないよう、キーボード（PC）では計器の左の外側、タッチ操作では計器の中（右端）、小さい横画面では計器の右端の上に置く */
.shoutBtn{position:absolute;right:100%;top:50%;margin-right:10px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:60px;height:50px;padding:0 9px;border-radius:12px;border:2px solid rgba(255,255,255,.85);background:radial-gradient(circle at 50% 28%,#ff6a55,#c8261b 72%);color:#fff;font-family:var(--f-ui);font-weight:700;font-size:13px;line-height:1;box-shadow:0 3px 0 #6e0f0a,0 0 0 1px rgba(0,0,0,.45);text-shadow:0 1px 1px rgba(0,0,0,.45);touch-action:manipulation;white-space:nowrap}

#shoutBubble{z-index:7;transform:translateX(-50%) rotate(-2deg);padding:8px 16px 9px;background:#fff;color:#141414;border:3px solid #141414;border-radius:22px;font-family:var(--f-display);font-size:clamp(16px,min(3.2vw,5.5vh),30px);line-height:1.25;white-space:nowrap;box-shadow:4px 5px 0 rgba(0,0,0,.35);letter-spacing:.02em}
#shoutBubble::before,#shoutBubble::after{content:'';position:absolute;left:50%;border-style:solid;border-color:transparent}
#shoutBubble::before{bottom:-17px;margin-left:-11px;border-width:17px 11px 0;border-top-color:#141414}
#shoutBubble::after{bottom:-11px;margin-left:-7px;border-width:12px 7px 0;border-top-color:#fff}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
// ===== 00_boot.js : 起動の確認と、起動・実行中の問題の表示 =====
// three.js を読み込めない・WebGL が使えないときは「読み込み中」のまま止めず、理由と再読み込みボタンを出す。
// 実行中の予期しないエラーや、3D表示の中断（WebGLコンテキストの喪失）も画面で知らせる。
const BOOT_MSG={
  three:['3D表示の部品を読み込めませんでした','3D表示に使うプログラム（three.js）を、インターネットから読み込めませんでした。接続を確かめてから、再読み込みしてください。'],
  webgl:['このブラウザでは3D表示が使えません','3D表示（WebGL）が使えないか、無効になっています。Chrome・Safari・Edge などのブラウザの新しい版で開くか、ブラウザの設定でハードウェアアクセラレーション（グラフィックの高速化）を有効にしてから、再読み込みしてください。'],
  init:['起動中にエラーが起きました','再読み込みしてください。何度も起きるときは、別のブラウザでもお試しください。']};
function bootFail(kind,detail){const el=document.getElementById('loadMsg');if(!el)return;const[t,x]=BOOT_MSG[kind]||BOOT_MSG.init;
  el.hidden=false;el.className='bootErr';el.setAttribute('role','alert');el.textContent='';
  const h=document.createElement('b');h.textContent=t;const p=document.createElement('p');p.textContent=x;el.append(h,p);
  if(detail){const d=document.createElement('p');d.className='small';d.textContent='詳細：'+String(detail).slice(0,160);el.append(d);}
  const b=document.createElement('button');b.type='button';b.textContent='再読み込み';b.onclick=()=>location.reload();el.append(b);}
// WebGL が使えるか（確かめた描画領域はすぐ手放す）
function webglOK(){try{if(!window.WebGLRenderingContext)return false;const c=document.createElement('canvas');const gl=c.getContext('webgl2')||c.getContext('webgl')||c.getContext('experimental-webgl');if(!gl)return false;
  const x=gl.getExtension('WEBGL_lose_context');if(x)x.loseContext();return true;}catch(e){return false;}}
// 画面上部のお知らせ（3D表示の中断・復帰、予期しないエラー）
let SYS_T=null;
function sysNotice(kind,detail){const n=document.getElementById('sysNotice');if(!n)return;clearTimeout(SYS_T);
  const M={lost:'3D表示が一時的に中断されました。運転を一時停止しています。自動で戻るのを待っています。戻らないときは再読み込みしてください。',

const V3 = THREE.Vector3;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(t)=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const wrapA=(a)=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a;};
const KMH=3.6;
function rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=rng(20261011);
const pick=(arr,r=R)=>arr[Math.floor(r()*arr.length)];
const rint=(a,b,r=R)=>a+Math.floor(r()*(b-a+1));
const rrange=(a,b,r=R)=>a+r()*(b-a);
const fwd=(h)=>({x:Math.sin(h),z:-Math.cos(h)});
const rightV=(h)=>({x:Math.cos(h),z:Math.sin(h)});
const headingOf=(dx,dz)=>Math.atan2(dx,-dz);
const dist2=(ax,az,bx,bz)=>{const dx=ax-bx,dz=az-bz;return dx*dx+dz*dz;};
function store(k,v){try{if(v===undefined){const s=localStorage.getItem(k);return s?JSON.parse(s):null;}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
// 色：コード中の16進はsRGB。描画はリニアで行うので変換して使う
const _colCache=new Map();
function C(hex){let c=_colCache.get(hex);if(!c){c=new THREE.Color(hex);c.convertSRGBToLinear();_colCache.set(hex,c);}return c;}
function lambert(hex,o){return new THREE.MeshLambertMaterial(Object.assign({color:C(hex)},o||{}));}
function basic(hex,o){return new THREE.MeshBasicMaterial(Object.assign({color:C(hex)},o||{}));}

// ---- ジオメトリの結合（頂点カラー・タイルごと） ----
let TILE=120;// 地図ごとに変えられる（大きいほど描画の呼び出しが減る）
class Batch{
  constructor(){this.g=new Map();this.nv=0;}
  _grp(key,x,z){const k=key+'|'+Math.floor(x/TILE)+','+Math.floor(z/TILE);let o=this.g.get(k);if(!o){o={key,p:[],n:[],c:[],u:[]};this.g.set(k,o);}return o;}
  _v(o,x,y,z,nx,ny,nz,c,u,v){o.p.push(x,y,z);o.n.push(nx,ny,nz);o.c.push(c.r,c.g,c.b);o.u.push(u,v);}
  addGeo(key,geo,m,color,tileX,tileZ){
    const g=geo.index?geo.toNonIndexed():geo;const P=g.attributes.position,N=g.attributes.normal,U=g.attributes.uv;
    const e=new V3(),nm=new THREE.Matrix3().getNormalMatrix(m);const col=typeof color==='object'?color:C(color);
    const t=new V3().setFromMatrixPosition(m);
    const o=this._grp(key,tileX!==undefined?tileX:t.x,tileZ!==undefined?tileZ:t.z);
    for(let i=0;i<P.count;i++){e.fromBufferAttribute(P,i).applyMatrix4(m);o.p.push(e.x,e.y,e.z);
      e.fromBufferAttribute(N,i).applyMatrix3(nm).normalize();o.n.push(e.x,e.y,e.z);o.c.push(col.r,col.g,col.b);
      if(U)o.u.push(U.getX(i),U.getY(i));else o.u.push(0,0);}}
  // 頂点カラーをそのまま使う（車の形など、mergeParts で作ったもの）
  addGeoVC(key,geo,m){const g=geo.index?geo.toNonIndexed():geo;const P=g.attributes.position,N=g.attributes.normal,Cl=g.attributes.color;const e=new V3(),nm=new THREE.Matrix3().getNormalMatrix(m);const t=new V3().setFromMatrixPosition(m);const o=this._grp(key,t.x,t.z);
    for(let i=0;i<P.count;i++){e.fromBufferAttribute(P,i).applyMatrix4(m);o.p.push(e.x,e.y,e.z);e.fromBufferAttribute(N,i).applyMatrix3(nm).normalize();o.n.push(e.x,e.y,e.z);if(Cl)o.c.push(Cl.getX(i),Cl.getY(i),Cl.getZ(i));else o.c.push(1,1,1);o.u.push(0,0);}}

function arrowPath(x,pts,w,head){// pts: 折れ線、最後が矢先

  const a=pts[pts.length-2],b=pts[pts.length-1];const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy);const ux=dx/L,uy=dy/L;const hb=[b[0]-ux*head*1.05,b[1]-uy*head*1.05];x.lineTo(hb[0],hb[1]);x.stroke();
  x.beginPath();x.moveTo(b[0],b[1]);x.lineTo(hb[0]-uy*head*0.85,hb[1]+ux*head*0.85);x.lineTo(hb[0]+uy*head*0.85,hb[1]-ux*head*0.85);x.closePath();x.fill();}

  x.fillStyle=SC.white;x.fillRect(cx-w*0.17,cy-h*0.46,w*0.15,h*0.3);x.fillRect(cx+w*0.02,cy-h*0.46,w*0.15,h*0.3);
  x.fillStyle=col;for(const k of[-0.28,0.28]){x.beginPath();x.arc(cx+w*k,cy+h*0.3,h*0.22,0,7);x.fill();}x.fillStyle=SC.white;for(const k of[-0.28,0.28]){x.beginPath();x.arc(cx+w*k,cy+h*0.3,h*0.08,0,7);x.fill();}}
function symTruck(x,cx,cy,w,col){const h=w*0.5;x.fillStyle=col;x.fillRect(cx-w/2,cy-h*0.6,w*0.66,h*0.75);x.beginPath();x.moveTo(cx+w*0.18,cy-h*0.3);x.lineTo(cx+w*0.38,cy-h*0.3);x.lineTo(cx+w/2,cy-h*0.05);x.lineTo(cx+w/2,cy+h*0.15);x.lineTo(cx+w*0.18,cy+h*0.15);x.closePath();x.fill();

function symPed(x,cx,cy,h,col,walk=1,dir=1){x.fillStyle=col;x.strokeStyle=col;const s=h/10;x.beginPath();x.arc(cx+dir*s*0.6,cy-s*3.9,s*0.95,0,7);x.fill();
  x.lineCap='round';x.lineWidth=s*1.25;x.beginPath();x.moveTo(cx+dir*s*0.4,cy-s*2.6);x.lineTo(cx,cy+s*0.6);x.stroke();
  x.lineWidth=s*1.05;x.beginPath();x.moveTo(cx,cy+s*0.6);x.lineTo(cx+dir*s*1.5*walk,cy+s*3.4);x.lineTo(cx+dir*s*2.0*walk,cy+s*3.6);x.moveTo(cx,cy+s*0.6);x.lineTo(cx-dir*s*1.2*walk,cy+s*2.4);x.lineTo(cx-dir*s*1.8*walk,cy+s*4.0);x.stroke();
  x.beginPath();x.moveTo(cx+dir*s*0.3,cy-s*2.2);x.lineTo(cx+dir*s*1.7,cy-s*0.6);x.moveTo(cx+dir*s*0.3,cy-s*2.2);x.lineTo(cx-dir*s*1.3,cy-s*0.9);x.stroke();x.lineCap='butt';}

const SIGNUV={};const SIGNPAGES=[];
function buildSignAtlas(ids,cell=192){const per=Math.floor(2048/cell);const pages=[];let k=0,page=null,ctx=null;
  const uniq=[...new Set(ids)].filter(id=>SIGNART[id]);
  for(const id of uniq){if(k%(per*per)===0){page=cvs(2048,2048);ctx=page.getContext('2d');pages.push(page);}const i=k%(per*per);const cx=(i%per)*cell,cy=Math.floor(i/per)*cell;
    ctx.save();ctx.translate(cx+6,cy+6);try{SIGNART[id].draw(ctx,cell-12);}catch(e){console.warn('sign',id,e);}ctx.restore();
    const pg=pages.length-1;SIGNUV[id]={page:pg,uv:[(cx+6)/2048,1-(cy+cell-6)/2048,(cx+cell-6)/2048,1-(cy+6)/2048]};k++;}
  SIGNPAGES.length=0;pages.forEach((p,i)=>{const t=texFrom(p,false);t.anisotropy=MAXANISO;t.generateMipmaps=true;SIGNPAGES.push(t);MAT['sign'+i]=new THREE.MeshLambertMaterial({map:t,transparent:true,alphaTest:0.35,vertexColors:true});
    MAT['decal'+i]=new THREE.MeshLambertMaterial({map:t,transparent:true,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3,polygonOffsetUnits:-6,vertexColors:true});});}
function signCell(id){const e=SIGNUV[id]||SIGNUV.blank;return e;}
// 標識画像（図鑑・HUD用）をcanvasで返す
function signCanvas(id,px=96){const c=cvs(px,px);const x=c.getContext('2d');if(SIGNART[id])SIGNART[id].draw(x,px);return c;}

class Road{

  yAt(s){const Y=this.Y;if(!Y)return 0;const i=this.idx(s),S=this.S;const k=clamp((s-S[i])/((S[i+1]-S[i])||1),0,1);return Y[i]+(Y[i+1]-Y[i])*k;}

// パス（[x,z]の折れ線＋角の丸め、または start+pieces）から細かい点列を作る
function pathSamples(d,step=2.5){const out=[];
  if(d.pieces){let x=d.start[0],z=d.start[1],h=d.start[2]||0;out.push({x,z});
    for(const p of d.pieces){if(p.l){const n=Math.max(1,Math.ceil(p.l/step));const f=fwd(h);for(let i=1;i<=n;i++)out.push({x:x+f.x*p.l*i/n,z:z+f.z*p.l*i/n});x+=f.x*p.l;z+=f.z*p.l;}
      else{const ang=p.a*Math.PI/180,len=Math.abs(ang)*p.r;const n=Math.max(2,Math.ceil(len/1.5));const dh=ang/n,ds=len/n;for(let i=0;i<n;i++){h+=dh/2;const f=fwd(h);x+=f.x*ds;z+=f.z*ds;h+=dh/2;out.push({x,z});}}}
    return out;}
  const P=d.path.map(p=>({x:p[0],z:p[1]}));const rad=(i)=>Array.isArray(d.r)?d.r[i]||0:(d.r||0);
  const push=(a,b)=>{const L=Math.hypot(b.x-a.x,b.z-a.z);const n=Math.max(1,Math.ceil(L/step));for(let i=1;i<=n;i++)out.push({x:a.x+(b.x-a.x)*i/n,z:a.z+(b.z-a.z)*i/n});};
  out.push(P[0]);let cur=P[0];
  for(let i=1;i<P.length-1;i++){const A=P[i-1],B=P[i],Cc=P[i+1];const h1=headingOf(B.x-A.x,B.z-A.z),h2=headingOf(Cc.x-B.x,Cc.z-B.z);const th=wrapA(h2-h1);let r=rad(i);
    if(Math.abs(th)<1e-3||r<=0){push(cur,B);cur=B;continue;}
    const l1=Math.hypot(B.x-A.x,B.z-A.z),l2=Math.hypot(Cc.x-B.x,Cc.z-B.z);let T=r*Math.tan(Math.abs(th)/2);const maxT=Math.min(i===1?l1:l1/2,i===P.length-2?l2:l2/2)*0.98;if(T>maxT){T=maxT;r=T/Math.tan(Math.abs(th)/2);}

    cur={x:B.x+f2.x*T,z:B.z+f2.z*T};}

// ---------- 車線 ----------
class Lane{
  constructor(road,dir,idx,kind,o){this.road=road;this.dir=dir;this.idx=idx;this.kind=kind||'main';this.id=NET.lanes.length;NET.lanes.push(this);
    this.s0=0;this.s1=road.len;this.w=road.w;this.next=[];this.prev=[];this.conns=[];this.agents=[];this.arrows=null;this.bus=false;this.line=null;
    if(o)Object.assign(this,o);
    if(this.kind==='main'){const n=dir>0?road.nF:road.nB;const m=road.nB&&road.nF?road.med.w/2:0;
      if(road.nB&&road.nF)this.tC=dir>0?-(m+(n-1-idx)*this.w+this.w/2):(m+(n-1-idx)*this.w+this.w/2);
      else this.tC=dir>0?(-n*this.w/2+idx*this.w+this.w/2):(n*this.w/2-idx*this.w-this.w/2);}

  get len(){return this.s1-this.s0;}
  tAt(s){if(this.kind==='main')return this.tC;const p=this;if(p.kA>0&&s<p.s0+p.kA)return lerp(p.tA,p.tC,smooth((s-p.s0)/p.kA));if(p.kB>0&&s>p.s1-p.kB)return lerp(p.tC,p.tB,smooth((s-(p.s1-p.kB))/p.kB));return p.tC;}
  wAt(s){if(this.kind==='main')return this.w;const p=this;if(p.kA>0&&p.wA0&&s<p.s0+p.kA)return this.w*smooth((s-p.s0)/p.kA);if(p.kB>0&&p.wB0&&s>p.s1-p.kB)return this.w*(1-smooth((s-(p.s1-p.kB))/p.kB));return this.w;}
  sOf(u){return this.dir>0?this.s0+u:this.s1-u;}
  uOf(s){return this.dir>0?s-this.s0:this.s1-s;}
  pos(u,d=0){const s=this.sOf(u);const P=this.road.at(s);const t=this.tAt(s)+d*this.dir;let h=this.dir>0?P.h:wrapA(P.h+Math.PI);
    if(this.kind!=='main'){const e=0.5;const dt=(this.tAt(Math.min(this.s1,s+e))-this.tAt(Math.max(this.s0,s-e)))/(2*e);h+=Math.atan(dt);}

  startNode(){return this.dir>0?this.road.startNode:this.road.endNode;}
  endNode(){return this.dir>0?this.road.endNode:this.road.startNode;}
  entryLeg(){return this.dir>0?this.road.endLeg:this.road.startLeg;}// 終点側の交差点にどの脚から入るか
  // 隣の車線（side=-1:進行方向左、+1:右）とその境界線の種類
  neighbor(side,s){const ls=this.road.allLanes(this.dir);let best=null,bd=1e9;const t0=this.tAt(s),w0=this.wAt(s);const want=t0+side*this.dir*w0/2;
    for(const l of ls){if(l===this||s<l.s0+0.5||s>l.s1-0.5)continue;const w=l.wAt(s);if(w<1.4)continue;const t=l.tAt(s);const edge=t-side*this.dir*w/2;const dd=Math.abs(edge-want);
      if((t-t0)*side*this.dir>0.5&&dd<bd){bd=dd;best=l;}}
    return bd<0.9?best:null;}
  lineTo(side,s){// 境界線（'dash','solid','yellow','thick'）
    const nb=this.neighbor(side,s);if(!nb)return null;const p=this.kind!=='main'?this:nb.kind!=='main'?nb:null;
    if(p){if(p.lineType)return p.lineType(s,this.dir);return'dash';}
    const r=this.road;const ys=r.def.yellowSep;if(ys&&ys.some(([a,b])=>s>=a&&s<=b))return'yellow';// 区間の黄色の線（トンネルなど：進路変更禁止）
    const sEnd=this.dir>0?r.len-s:s;// 交差点までの距離
    if(r.sepYellow&&sEnd<r.sepYellow)return'yellow';
    if(r.sepSolid&&sEnd<r.sepSolid&&this.endNode()&&this.endNode().kind==='x')return'solid';return r.sep;}
}
// 付加車線（右折レーン・加速車線・減速車線）
function addPatch(road,o){// o:{dir,kind,s0,s1,side:'L'|'R',kA,kB,wA0,wB0}
  const dir=o.dir;const base=o.side==='R'?(dir>0?road.lanesF[road.nF-1]:road.lanesB[road.nB-1]):(dir>0?road.lanesF[0]:road.lanesB[0]);const w=o.w||road.w;

  const s0=o.s0<0?road.len+o.s0:o.s0,s1=o.s1<=0?road.len+o.s1:o.s1;
  const p=new Lane(road,dir,o.side==='R'?(dir>0?road.nF:road.nB):-1,o.kind,{s0,s1,w,tC,tA:o.tA!==undefined?o.tA:edge,tB:o.tB!==undefined?o.tB:edge,kA:o.kA||0,kB:o.kB||0,wA0:!!o.wA0,wB0:!!o.wB0,base,side:o.side,lineKind:o.line||'dash',pid:o.pid||null,dest:o.dest||null,exitP:o.exitP});

    // 道路の端（s）をこえた分・車道の外（t）の分を減点して、いちばん「中にいる」道路を選ぶ
    const sOut=Math.max(0,-q.s,q.s-r.len);const[lo,hi]=r.tRange(clamp(q.s,0,r.len));const tOut=Math.max(0,lo-q.t,q.t-hi);
    const cand={kind:'road',road:r,s:clamp(q.s,0,r.len),t:q.t,y:yr};classify(cand);const bandPen=cand.band==='lane'?0:cand.band==='shoulder'||cand.band==='median'?1.5:4;
    const score=dy*4+(Math.abs(q.t)>40?Math.abs(q.t):0)+q.dd*10+kOut*10+sOut*20+tOut*2+bandPen;if(score<bs){bs=score;best=cand;}}
  if(best&&(best.band==='lane'||best.band==='shoulder'||(best.band==='median'&&best.road.medDrivable(best.s))))return best;
  // 駐車場・車庫などの区画（道路の端の外側にあっても、区画の中なら区画を優先）
  for(const e of a)if(e.k==='l'&&lotHas(e.L,x,z)&&(y===undefined||Math.abs((e.L.y||0)-y)<3))return{kind:'lot',lot:e.L,y:e.L.y||0,band:'lot'};
  return best;}
// 開発用：locate の候補を全部返す
function locateDbg(x,z){const G=NET.GS;const a=NET.grid.get(gkey(Math.floor(x/G),Math.floor(z/G)))||[];const out=[];for(const e of a){if(e.k!=='r')continue;const r=e.r;const q=projRoad(r,e.i,x,z);
    const cand={kind:'road',road:r,s:clamp(q.s,0,r.len),t:q.t};classify(cand);out.push({id:r.id,i:e.i,k:+q.k.toFixed(3),s:+q.s.toFixed(2),t:+q.t.toFixed(2),dd:+q.dd.toFixed(3),band:cand.band});}return out;}
// 横位置の分類：lane / shoulder / median / walk / off
function classify(q){const r=q.road,s=q.s,t=q.t;q.band='off';
  for(const dir of[1,-1]){if(dir<0&&!r.nB)continue;for(const l of r.allLanes(dir)){if(s<l.s0-0.3||s>l.s1+0.3)continue;const w=l.wAt(s);if(w<0.3)continue;if(Math.abs(t-l.tAt(s))<=w/2+0.001){q.band='lane';q.lane=l;q.dir=dir;return q;}}}
  for(const[lo,hi]of r.drivableBands(s)){if(t>=lo&&t<=hi){q.band='shoulder';q.dir=t<0||!r.nB?1:-1;if(r.nB&&r.nF&&t>r.bandF()[1]&&t<r.bandB()[0])q.band='median';return q;}}
  const[lo,hi]=r.tRange(s);if(t<lo&&t>lo-(r.walk[0]||0)-0.01)q.band='walk';else if(t>hi&&t<hi+(r.walk[1]||0)+0.01)q.band='walk';else if(t>lo&&t<hi)q.band='median';return q;}
function isDrivable(x,z,y){const q=locate(x,z,y);if(!q)return false;if(q.kind==='node'||q.kind==='lot')return true;return q.band==='lane'||q.band==='shoulder'||(q.band==='median'&&q.road.medDrivable(q.s));}
// 駐車場・構内（多角形）
function lotHas(L,x,z){if(x<L.x0||x>L.x1||z<L.z0||z>L.z1)return false;let inside=false;const P=L.poly;for(let i=0,j=P.length-1;i<P.length;j=i++){const xi=P[i][0],zi=P[i][1],xj=P[j][0],zj=P[j][1];
    if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/((zj-zi)||1e-9)+xi))inside=!inside;}
  if(!inside)return false;for(const h of L.holes||[]){let ins=false;for(let i=0,j=h.length-1;i<h.length;j=i++){const xi=h[i][0],zi=h[i][1],xj=h[j][0],zj=h[j][1];if(((zi>z)!==(zj>z))&&(x<(xj-xi)*(z-zi)/((zj-zi)||1e-9)+xi))ins=!ins;}if(ins)return false;}
  return true;}
function addLot(L){L.x0=Math.min(...L.poly.map(p=>p[0]));L.x1=Math.max(...L.poly.map(p=>p[0]));L.z0=Math.min(...L.poly.map(p=>p[1]));L.z1=Math.max(...L.poly.map(p=>p[1]));NET.lots.push(L);return L;}

// ---------- 経路探索（車線グラフ） ----------
// 車線→(接続路/直結)→車線。車線変更は隣の車線へ（費用を加算）
function laneSucc(l){const out=[];for(const c of l.conns)out.push({lane:c.next,conn:c,cost:c.len});for(const n of l.next)out.push({lane:n.lane,cost:0.1});return out;}
function routeLanes(from,goal,opts={}){// from:Lane, goal: Lane or fn(l)
  const isGoal=typeof goal==='function'?goal:(l)=>l===goal;const dist=new Map([[from,0]]),prev=new Map();const q=[from];const seen=new Set();
  while(q.length){let bi=0;for(let i=1;i<q.length;i++)if(dist.get(q[i])<dist.get(q[bi]))bi=i;const u=q.splice(bi,1)[0];if(seen.has(u))continue;seen.add(u);
    if(isGoal(u)){const steps=[];let p=u;while(prev.has(p)){const e=prev.get(p);steps.unshift({lane:e.lane,conn:e.conn||null,lc:e.lc||0});p=e.from;}steps.unshift({lane:from,conn:null,lc:0});return steps;}
    const du=dist.get(u);const nb=[];for(const e of laneSucc(u))nb.push({to:e.lane,conn:e.conn,cost:e.cost+e.lane.len});
    for(const side of[-1,1]){const n=u.neighbor(side,(u.s0+u.s1)/2)||u.neighbor(side,u.dir>0?u.s1-5:u.s0+5)||u.neighbor(side,u.dir>0?u.s0+5:u.s1-5);if(n)nb.push({to:n,lc:side,cost:25});}
    for(const e of nb){const nd=du+e.cost;if(!dist.has(e.to)||nd<dist.get(e.to)){dist.set(e.to,nd);prev.set(e.to,{from:u,lane:e.to,conn:e.conn,lc:e.lc});q.push(e.to);}}}
  return null;}

// v1の格子道路を、交差点ごとに区切った道路に変換する
function townDef(){const T=TOWN;const nodes=[],roads=[];const nmap=new Map();
  const key=(x,z)=>x+','+z;
  const getNode=(x,z,kind)=>{const k=key(x,z);let n=nmap.get(k);if(!n){n={id:k,x,z,kind};nmap.set(k,n);nodes.push(n);}return n;};
  // 交差点
  for(const a of T.ROADS)if(a.ax==='x')for(const b of T.ROADS)if(b.ax==='z'){if(b.c>=a.a&&b.c<=a.b&&a.c>=b.a&&a.c<=b.b)getNode(b.c,a.c,'x');}
  // 地図の外へ続く端
  for(const r of T.ROADS)for(const e of[r.a,r.b]){const x=r.ax==='x'?e:r.c,z=r.ax==='x'?r.c:e;if(!nmap.get(key(x,z))&&Math.abs(e)>=380)getNode(x,z,'portal');}
  for(const n of nodes){if(n.kind!=='x')continue;const sg=T.SIGNALS[n.id];if(sg){n.signal={arrow:!!sg.arrow,g:{NS:16,EW:18}};n.xwalk=true;}if(T.STOPS[n.id])n.stop=T.STOPS[n.id];}
  const prof=(k)=>k==='R'?{type:'COL',w:3.25,sh:[0.5,0],center:'yellow',walk:[3,3],tier:'R'}:k==='C'?{type:'COL',w:3.0,sh:[0.3,0],center:'white',walk:[2.5,2.5],tier:'C'}:{type:'RES',w:2.0,sh:[0.6,0],center:'none',walk:[0,0],tier:'S'};
  for(const r of T.ROADS){const ns=nodes.filter(n=>r.ax==='x'?(n.z===r.c&&n.x>=r.a&&n.x<=r.b):(n.x===r.c&&n.z>=r.a&&n.z<=r.b)).sort((p,q)=>r.ax==='x'?p.x-q.x:p.z-q.z);
    for(let i=0;i<ns.length-1;i++){const A=ns[i],B=ns[i+1];const P=prof(r.kind);
      const d=Object.assign({id:r.id+'_'+i,name:r.name,group:r.id,from:A.id,to:B.id,path:[[A.x,A.z],[B.x,B.z]],nF:1,nB:r.oneway?0:1,limit:r.limit||0,feats:[]},P);
      if(r.oneway){d.nB=0;d.nF=1;d.w=2.4;d.sh=[0.6,0.6];}
      // 横断歩道・踏切（v1の絶対座標→この道路のs）
      const c0=r.ax==='x'?A.x:A.z,c1=r.ax==='x'?B.x:B.z;
      for(const m of T.MIDXWALK)if(m.road===r.id&&m.pos>c0&&m.pos<c1)d.feats.push({type:'xwalk',abs:m.pos,w:4});
      if(r.ax==='z'&&T.RAIL_Z>c0&&T.RAIL_Z<c1)d.feats.push({type:'rail',abs:T.RAIL_Z,w:10});

  for(const n of nodes){if(n.kind!=='x')continue;const tiers=[];for(const d of roads){if(d.from===n.id||d.to===n.id)tiers.push(d.tier);}
    const allS=tiers.every(t=>t==='S');const corner=tiers.length===2;n.filR=allS?(corner?6:4.5):5;}
  return{nodes,roads,links:[]};}
// 道路の絶対座標(v1のalong)→v2のs（区切った道路ごと）
function townFeatS(r){for(const f of r.feats){if(f.abs===undefined)continue;const a=r.at(0),b=r.at(r.len);const ax=Math.abs(b.x-a.x)>Math.abs(b.z-a.z);const p0=ax?a.x:a.z,p1=ax?b.x:b.z;f.s=(f.abs-p0)/(p1-p0)*r.len;}}
// v1互換：グループ名(R1など)と絶対座標から道路とsを得る
function townRoadAt(group,along){for(const r of NET.roads){if(r.def.group!==group)continue;const a=r.at(0),b=r.at(r.len);const ax=Math.abs(b.x-a.x)>Math.abs(b.z-a.z);const p0=ax?a.x:a.z,p1=ax?b.x:b.z;

  const segs=[];

      const d=Object.assign({id:r.id+'_'+i,name:r.name,group:r.id,from:A.id,to:B.id,path:[[A.x,A.z],[B.x,B.z]],feats:[]},P);
      const dx=Math.sign(B.x-A.x),dz=Math.sign(B.z-A.z);const Lstart=legOfDir(dx,dz),Lend=legOfDir(-dx,-dz);// 始点側の交差点では Lstart の脚、終点側では Lend の脚

    n.filR=small?4.5:tiers.includes('AV')||tiers.includes('AR')?9:tiers.includes('ST')?8:6;

function buildNodeMesh(B,n){const y=n.y||0;const legs=Object.keys(n.legs);const anyRes=legs.every(L=>n.legs[L].road.type==='RES');const col=anyRes?COL.asphRES:COL.asph;
  B.poly('road',[[n.x-n.hx,n.z-n.hz],[n.x+n.hx,n.z-n.hz],[n.x+n.hx,n.z+n.hz],[n.x-n.hx,n.z+n.hz]],y,col,8);
  for(const f of n.fil){const pts=[];for(let i=0;i<=10;i++){const a=Math.PI+i/10*Math.PI/2;pts.push([f.px+f.sx*(f.r+f.r*Math.cos(a)),f.pz+f.sz*(f.r+f.r*Math.sin(a))]);}
    pts.push([f.px,f.pz]);B.poly('road',pts,y,col,8);}
  // 歩道の角
  for(const sx of[-1,1])for(const sz of[-1,1]){const hL=sx>0?'E':'W',vL=sz>0?'S':'N';const H=n.legs[hL],V=n.legs[vL];
    const swH=H?H.road.walk[sideOfWalk(H,sx,sz)]:0,swV=V?V.road.walk[sideOfWalk(V,sx,sz)]:0;const sw=Math.max(swH||0,swV||0);if(!sw)continue;
    const px=n.x+sx*n.hx,pz=n.z+sz*n.hz;const f=n.fil.find(q=>q.sx===sx&&q.sz===sz);
    if(f){const rr=f.r,S=rr+sw;const pts=[[px,pz+sz*S],[px,pz+sz*rr]];for(let i=0;i<=10;i++){const a=Math.PI+i/10*Math.PI/2;pts.push([px+sx*(rr+rr*Math.cos(a)),pz+sz*(rr+rr*Math.sin(a))]);}
      pts.push([px+sx*S,pz]);pts.push([px+sx*S,pz+sz*S]);B.poly('walk',pts,y+0.15,0xffffff,4);
      const arc=[];for(let i=0;i<=10;i++){const a=Math.PI+i/10*Math.PI/2;arc.push({x:px+sx*(rr+rr*Math.cos(a)),y,z:pz+sz*(rr+rr*Math.sin(a))});}
      // 縁石の向き：交差点側へ
      B.wall('def',arc,0.15,COL.curb,(sx*sz)>0?-1:1);}
    else if(!H&&!V){}
    else{// 片側の脚がない：歩道をまっすぐつなぐ
      const x0=Math.min(px,px+sx*sw),x1=Math.max(px,px+sx*sw),z0=Math.min(pz,pz+sz*sw),z1=Math.max(pz,pz+sz*sw);B.poly('walk',[[x0,z0],[x1,z0],[x1,z1],[x0,z1]],y+0.15,0xffffff,4);}}
  // 脚のない辺：歩道を横切らせる
  for(const L of['N','S','E','W']){if(n.legs[L])continue;const other=L==='N'||L==='S'?['E','W']:['N','S'];const sw=Math.max(...other.map(o=>n.legs[o]?n.legs[o].road.walk[0]:0));if(!sw)continue;

      B.wall('def',[{x:n.x-n.hx,y,z:z0},{x:n.x+n.hx,y,z:z0}],0.15,COL.curb,sz>0?-1:1);}
    else{const sx=L==='E'?1:-1;const x0=n.x+sx*n.hx,x1=x0+sx*sw;B.poly('walk',[[Math.min(x0,x1),n.z-n.hz],[Math.max(x0,x1),n.z-n.hz],[Math.max(x0,x1),n.z+n.hz],[Math.min(x0,x1),n.z+n.hz]],y+0.15,0xffffff,4);
      B.wall('def',[{x:x0,y,z:n.z-n.hz},{x:x0,y,z:n.z+n.hz}],0.15,COL.curb,sx>0?1:-1);}}}

// 経路探索（Uターンなし）：交差点ごとに「どの脚から入ってきたか」を状態に持つ。exitLeg: 最後の交差点で出ていく脚（入ってきた脚とは別でないといけない）
function routeNodes(from,to,banLeg,exitLeg){if(!from||!to)return null;const key=(n,L)=>n.id+'|'+(L||'');
  const s0={n:from,L:banLeg||null,start:true};const dist=new Map([[key(from,s0.L),0]]),prev=new Map(),q=[s0];let end=null;
  while(q.length){let bi=0;for(let i=1;i<q.length;i++)if(dist.get(key(q[i].n,q[i].L))<dist.get(key(q[bi].n,q[bi].L)))bi=i;const cur=q.splice(bi,1)[0];const du=dist.get(key(cur.n,cur.L));
    if(cur.n===to&&!cur.start&&(!exitLeg||cur.L!==exitLeg)){end=cur;break;}
    if(du>9000)continue;
    for(const L in cur.n.legs){if(L===cur.L)continue;const e=cur.n.legs[L];const r=e.road;const dir=e.end==='start'?1:-1;if(!r.lanes(dir).length||r.def.pedOnly)continue;
      // 指定方向外進行禁止（右折禁止など）
      if(cur.L&&cur.n.noTurn&&cur.n.noTurn[cur.L]&&cur.n.noTurn[cur.L].includes(turnOf(legHeading[cur.L],outHeading[L])))continue;
      const m=dir>0?r.endNode:r.startNode;if(!m)continue;if(m.kind==='portal'&&m!==to)continue;const Lm=dir>0?r.endLeg:r.startLeg;const k=key(m,Lm);const d=du+r.len+10;
      if(!dist.has(k)||d<dist.get(k)){dist.set(k,d);prev.set(k,cur);q.push({n:m,L:Lm});}}}
  if(!end){if(from===to&&(!exitLeg||banLeg!==exitLeg)){const p=[from];p.arrL=banLeg;return p;}return null;}
  const path=[end.n];let c=end;while(!c.start){c=prev.get(key(c.n,c.L));path.unshift(c.n);}path.arrL=end.L;return path;}
// ナビの経路：経由地を順に通ってゴールの道路へ（Uターンなし）
function navPath(n0,inLeg){const G=NAV.goal;const targets=[...NAV.wps];let gExit=null;if(G&&G.road){targets.push(G.dir>0?G.road.startNode:G.road.endNode);gExit=G.dir>0?G.road.startLeg:G.road.endLeg;}
  let path=[n0],cur=n0,ban=inLeg;
  for(let i=0;i<targets.length;i++){const t=targets[i];const last=i===targets.length-1;const ex=last?gExit:null;
    if(t===cur&&path.length===1&&(!last||!ex||ex!==ban)){if(last){path.exitLeg=ex;return path;}continue;}
    const seg=routeNodes(cur,t,ban,ex);if(!seg)return path.length>1?path:null;path=path.concat(seg.slice(1));cur=t;ban=seg.arrL;}
  path.exitLeg=gExit;return path;}

  const inLot=q&&((q.kind==='lot'&&q.lot.id==='MART')||(q.kind==='road'&&q.road.id==='LIN'));
  lotSpeedTick(dt,inLot);walkStopTick();

  if(!PK.phase&&q&&q.kind==='lot'&&Math.abs(p.z-(T.za-3.5))<3.5&&Math.cos(p.h+Math.PI/2)>0.8&&p.x<T.x+10)pkOnce('aisle',()=>coach('緑の枠を通り過ぎ、車の後ろの端が枠の先の白線を少し過ぎたら止まります。シフトR、後ろを目で確かめてから、ハンドルを左に切ってゆっくり後退。',10,1));}
// 駐車場の中の速度（ゲーム独自の目安：15km/h）
function lotSpeedTick(dt,inLot){const p=PLAYER;if(inLot&&Math.abs(p.v)*KMH>15){PK.spT=(PK.spT||0)+dt;if(PK.spT>2)violate('lotSpeed',`${Math.round(Math.abs(p.v)*KMH)}km/h`,15);}else PK.spT=0;}
// 道路から駐車場へ：歩道に入る直前の一時停止（第17条第2項）
function walkStopTick(){const p=PLAYER;const cs=corners(p.x,p.z,p.h,p.L,p.W);const fz=Math.min(cs[0].z,cs[1].z);const north=Math.cos(p.h)>0.25;const wz=PARK.walkZ;const nearX=Math.abs(p.x-PARK.LINX)<6.5;
  if(nearX&&north&&fz<wz[1]+4&&fz>wz[1]-0.3&&Math.abs(p.v)<0.3)PK.walkStopped=1;
  if(nearX&&north&&!PK.walkJudged&&fz<wz[1]-0.4&&p.v>0.3){PK.walkJudged=1;const ped=PK.walkPed;const block=ped&&ped.vis&&Math.abs(ped.x-PARK.LINX)<5.5;
    if(!PK.walkStopped)violate('walkStop',block?'歩道を歩いている人がいました。':'',0);else if(block)violate('walkStop','歩道の人が通り過ぎるのを待ってから入ります。',0);else praise('walkStopOK');}}
function p3Path(){const T=PARK.target;return[{x:PARK.LINX,z:PARK.LOT.z1-6},{x:200,z:-84},{x:200,z:T.za-3.5},{x:T.x-3.8,z:T.za-3.5}];}
function p3Nav(){const p=PLAYER;const T=PARK.target;const here={x:p.x,z:p.z};const tg={x:T.x,z:T.z};

    setNav('S',null,'行き過ぎました（一時停止メニューから「最初からやり直す」）');NAV.pts=[];return true;}
  const W=p3Path();if(PK.wi===undefined)PK.wi=0;while(PK.wi<W.length&&Math.hypot(W[PK.wi].x-p.x,W[PK.wi].z-p.z)<7)PK.wi++;

// 店の前を歩く買い物客（景色）
function evLotPeople(){const L=PARK.LOT;const ps=[];const rx=()=>L.x0+8+R()*(L.x1-L.x0-16);

  // 車線変更：実際に新しい車線の中央付近に着くまでは合図を出したまま
  if(a.lc){AUTO.lcT+=dt;if(AUTO.lcT<3.1){a.lc.t=0;a.d=a.lc.d0;// 動き出す直前に、もう一度すき間を確かめる
      if(AUTO.lcT>2.6&&a.lc.from&&a.lc.from.road===a.lane.road&&!laneSafeNow(a,a.lane,a.lane.sOf(a.u))){const side=a.lc.side>0?'R':'L';autoCancelLc(a);a.lcCool=2.5;if(p.blink===side)p.blink=null;}}}else if(AUTO.lastLc&&!a.lc&&Math.abs(a.dAct||0)<0.55){AUTO.lastLc=null;if(p.blink&&!goal&&!turnSoon&&!turnSame)p.blink=null;}
  // 右左折の合図（30m以上手前）
  if(!goal&&turnSoon&&p.blink!==a.next.conn.turn)setBlink(a.next.conn.turn);
  // 渋滞の最後尾：ハザードで後ろの車に知らせる（NEXCOの呼びかけ。法律上の義務ではない）
  if(a.lane.road.type==='EXP'&&!fault){const ld=leaderOnPath(a,320);const tail=ld.obj&&ld.vl<5&&ld.gap<300&&p.v>8;
    if(tail&&!AUTO.jamHzUsed&&!p.hazard){act('hz',true);AUTO.jamHz=true;AUTO.jamHzUsed=true;AUTO.jamT=0;}
    if(AUTO.jamHz){AUTO.jamT+=dt;if(p.v<1.5)AUTO.jamStopT=(AUTO.jamStopT||0)+dt;if((AUTO.jamStopT>3&&AUTO.jamT>6)||(!tail&&p.v>12&&AUTO.jamT>3)){if(p.hazard)act('hz',true);AUTO.jamHz=false;}}}
  // ライト（夜・霧・雨・トンネル）
  const tun=J.road&&J.road.tunnels&&J.road.tunnels.some(t=>J.s>t.s0-30&&J.s<t.s1+10);const needL=ENV.dark||ENV.mode==='fog'||ENV.mode==='rain'||tun;
  if(needL&&!p.lights){act('lt',true);AUTO.autoLights=true;}else if(!needL&&p.lights&&AUTO.autoLights){act('lt',true);AUTO.autoLights=false;}
  // 踏切：止まったら左右を目で確認してから
  const X=J.A&&J.A.xing;if(X&&X.stopped&&!X.entered&&p.v<0.25){if(!X.lookL){INPUT.lookUntilL=p.t+0.6;INPUT.lookUntilR=0;}else if(!X.lookR){INPUT.lookUntilL=0;INPUT.lookUntilR=p.t+0.6;}if(!(X.lookL&&X.lookR))acc=Math.min(acc,-1);}
  // 曲がった先の横断歩道：人がいれば車体がかかる手前で待つ（もうかかっていたら抜ける）
  {const cc=(AUTO.turn&&AUTO.turn.D.c)||a.conn||(a.next&&a.next.conn&&a.lane.len-a.u<18?a.next.conn:null);
    if(cc&&cc.turn!=='S'&&exitXwalkBusy(cc)){const X=exitXwalk(cc);if(X){const hit=xwalkHitAhead(ds=>{const P=autoTarget(ds),Q=autoTarget(ds+0.4);return{x:P.x,z:P.z,h:headingOf(Q.x-P.x,Q.z-P.z)};},p.L,p.W,X,14);
        if(hit!==null&&hit>0.2){const room=hit-0.45;acc=Math.min(acc,room>0?clamp((Math.sqrt(2*2.2*room)-p.v)*1.6,-7,1):-7);}}}}
  if(fault){const dA=(J.t2-a.lane.tAt(clamp(J.s,a.lane.s0,a.lane.s1)))*a.lane.dir;const on=a.lane.idx===0&&dA<-(a.lane.w/2+0.4);acc=on?-1.6:Math.min(acc,-0.4);}// 路肩に入ったら、車線を走る車には反応せずに静かに止まる
  const steer=autoSteer(p);
  let pa=0,pb=0;if(acc>0.05)pa=clamp(acc/2.2,0,1);else if(acc<-0.15)pb=clamp(-acc/7.5,0.04,1);if(p.v<0.3&&acc<0.05)pb=Math.max(pb,0.35);
  // 縁石などで進めなくなったら、少し下がってやり直す（保険）
  if(AUTO.rec){const Rc=AUTO.rec;Rc.t+=dt;
    if(Rc.ph===0){if(Math.abs(p.v)<0.05&&p.gear!=='R')cycleGear();if(p.gear==='R'){Rc.ph=1;Rc.d0=p.revDist||0;}INPUT.auto={acc:0,brk:0.5,steer:0};return;}
    if(Rc.ph===1){const back=(p.revDist||0)-Rc.d0;if(back<1.8&&Rc.t<5){INPUT.auto={acc:0.25,brk:0,steer:-Rc.steer};return;}Rc.ph=2;}
    if(Rc.ph===2){if(Math.abs(p.v)>0.05){INPUT.auto={acc:0,brk:0.8,steer:0};return;}if(p.gear!=='D')cycleGear();AUTO.rec=null;AUTO.stallT=0;}}
  if(pa>0.12&&Math.abs(p.v)<0.05&&J.started&&!p.pbrake)AUTO.stallT=(AUTO.stallT||0)+dt;else AUTO.stallT=0;
  if(AUTO.stallT>2.5){AUTO.rec={t:0,ph:0,steer};AUTO.stallT=0;}
  INPUT.auto={acc:pa,brk:pb,steer};}

})();
</script>
